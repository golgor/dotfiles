[providers]
bitwarden = { type = "bitwarden", backend = "rbw", auth_command = "rbw unlock" }

[secrets]
BACKSTAGE_MCP_TOKEN = { provider = "bitwarden", value = "backstage.iot.toolsense.io/MCP Token" }
FLESPI_TOKEN = { provider = "bitwarden", value = "flespi.io/My Token" }
BAMBOO_HR_API_TOKEN = { provider = "bitwarden", value = "bamboohr.com/API" }
GEMINI_API_KEY = { provider = "bitwarden", value = "Google (Toolsense)/Gemini API Key" }
OPENCODE_API_KEY = { provider = "bitwarden", value = "Opencode/API Key" }
TYPESAFE_API_KEY = { provider = "bitwarden", value = "Typesafe AI/API Key" }
XAI_API_KEY = { provider = "bitwarden", value = "xAI/API Key (Pi)" }
SLACK_AXI_TOKEN = { provider = "bitwarden", value = "ToolSense Slack Apps/Slack-axi OAuth Token" }
# gcx (Grafana CLI) is NOT here: it stores its Grafana service-account tokens in the OS
# keyring under named contexts, not as shell env vars. `mise run setup-gcx` authenticates
# the prod + dev contexts by pulling those tokens from Bitwarden via rbw. See
# .mise/tasks/setup-gcx.

# gws-axi's OAuth client JSON is a FILE, not an env var, so it is intentionally NOT
# a [secrets] entry (those are exported into every shell by `fnox activate`).
# `mise run setup-gws-axi` restores it from the Bitwarden note "gws-axi-json"
# (field "Secret") to ~/.config/gws-axi/credentials.json via rbw. See
# docs/axi/gws-axi.md.

[daemon]
enabled = true
idle_timeout = "8h"
