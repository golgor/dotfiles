# User-level CLI tools managed by ~/.dotfiles.
#
# This is linked into ~/.config/mise/conf.d so mise shims resolve these tools
# from any directory, not only inside ~/.dotfiles.
#
# User-level CLIs are declared only here. A project [tools] entry in
# ~/.dotfiles/mise.toml overrides the global version inside the repo, and a
# version mismatch there can break shell-integrated tools (a pinned atuin could
# not talk to the newer global daemon and stalled every prompt for ~8 s).
#
# uv is the one deliberate exception: this file provides the user-level uv, and
# ~/.dotfiles/mise.toml pins the uv that runs the repo's Python automation.

[tools]
atuin = "latest"
kubectl = "latest"
kubectx = "latest"
kubens = "latest"
fnox = "latest"
uv = "latest"
