[settings]
trusted_config_paths = ["/home/golgor/.no-mistakes/worktrees"]
# Global mise config, tracked by ~/.dotfiles and linked to ~/.config/mise/config.toml.
#
# Policy: every global tool is "latest"; a project that needs a specific version
# pins it in its own mise.toml. `mise up` (Omarchy alias: mup) moves latest
# forward; tools declared here do not upgrade on their own between runs.
#
# Omarchy's omarchy-settings package declares its default tools (claude, codex,
# gh, node, oh-my-pi, opencode, pi, ...) in /etc/mise/conf.d/omarchy-tools.toml
# as lazy, self-updating installs. Do not re-add them here as "latest": a user
# entry outranks Omarchy's and disables lazy install and auto-update. node is the
# deliberate exception; it stays here so it is installed eagerly.
#
# This is the only place the remaining global tools are declared. ~/.dotfiles/mise.toml has no
# [tools] table: the repo's tasks run after bootstrap has finished, so they use
# the global uv from here rather than a project pin.
#
# `mise use -g` and Omarchy migrations write through the symlink, so an ad-hoc
# global add shows up as a repo diff. Review it and commit or revert.

[settings.python]
compile = false

[settings.upgrade]
auto_prune = false  # also set by Omarchy's /etc/mise/conf.d/omarchy.toml; kept explicit

[tools]
atuin = "latest"
bun = "latest"
fnox = "latest"
go = "latest"
"go:go.iot.toolsense.io/bamboohr" = "latest"  # bhr, BambooHR CLI; needs GOPRIVATE from .bashrc
"github:grafana/gcx" = "latest"  # gcx, Grafana CLI; auth via `mise run setup-gcx` (keyring contexts)
"github:kunchenguid/no-mistakes" = "latest"  # AI validation gate for git push; upgrade via `mise up`, not `no-mistakes update`, then `no-mistakes daemon restart`
"github:kunchenguid/treehouse" = "latest"  # git worktree manager; required by Firstmate
kubectl = "latest"
kubectx = "latest"
kubens = "latest"
marksman = "latest"  # markdown LSP; pi-lens runs it as the primary markdown runner
"npm:@andershoffmann/obsidian-axi" = "latest"  # obsidian-axi; see docs/axi/obsidian-axi.md
"npm:@dbx-app/mcp-server" = "latest"  # DBX MCP server for agent DB access; see docs/tools/dbx.md
"npm:acpx" = "latest"  # ACP client; backpass routes model calls through it
"npm:backpass" = "latest"  # https://github.com/kunchenguid/backpass; needs acpx
"npm:chrome-devtools-axi" = "latest"  # see docs/axi/chrome-devtools-axi.md
"npm:gh-axi" = "latest"  # see docs/axi/gh-axi.md
"npm:gws-axi" = "latest"  # see docs/axi/gws-axi.md
"npm:lavish-axi" = "latest"  # see docs/axi/lavish-axi.md
"npm:notion-axi" = "latest"  # see docs/axi/notion-axi.md
"npm:ntn" = "latest"  # official Notion CLI; notion-axi wraps it
"npm:omo-ai" = "latest"  # omo; https://github.com/code-yeongyu/oh-my-openagent
"npm:quota-axi" = "latest"  # see docs/axi/quota-axi.md
"npm:slack-axi" = "latest"  # see docs/axi/slack-axi.md
"npm:superbee" = "latest"  # early/experimental; see docs/axi/superbee.md
"npm:tasks-axi" = "latest"  # see docs/axi/tasks-axi.md
python = "latest"
ruff = "latest"
uv = "latest"
