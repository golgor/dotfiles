# lavish-axi auto-binds this machine's Tailscale IP alongside loopback and then
# advertises the MagicDNS name as the review URL. Pinning the host disables that
# auto-detection (autoTailscale = !envHost), leaving the server loopback-only.
#
# Set here rather than in .bashrc: the review server is a long-lived daemon
# (dist/server.mjs server --port 4387) reused across sessions, so it inherits the
# environment of whatever first started it. A daemon spawned outside an
# interactive bash shell would miss a .bashrc export and serve on Tailscale for
# every later session.
LAVISH_AXI_HOST=127.0.0.1

# Every run posts a pageview to an Umami endpoint (a.kunchenguid.com by default).
# The behavior is in src/telemetry.js and is documented in neither the README nor
# the CLI help; failures are swallowed, so nothing here reports it.
LAVISH_AXI_TELEMETRY=0
