[project]
name = "automation"
version = "0"
description = "Python automation for ~/.dotfiles, run through mise tasks"
requires-python = ">=3.14"
# Runtime stays stdlib-only so `uv run --no-dev` works on a fresh machine
# without fetching anything but an interpreter. Verified with an empty
# UV_CACHE_DIR and --offline: uv builds uv_build projects natively, without
# downloading the backend, as long as the range below contains the running uv.
dependencies = []

[project.scripts]
# One console script per automation subpackage; mise.toml [tasks] call these.
skills = "automation.skills.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "ty>=0.0.78"]

[build-system]
# Keep in step with the uv version pinned in mise.toml, or the offline fast path is lost.
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
