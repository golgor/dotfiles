# One [[plugin]] per entry. Omit hosts for both golgor-pc and golgor-framework.
# The id must match manifest.json. Run `mise run sync-omarchy-plugins`.

[[plugin]]
id = "37signals.hey"
git = "https://github.com/basecamp/omarchy-hey-plugin.git"
hosts = ["golgor-pc"]

[[plugin]]
id = "crmne.hyprmoncfg"
git = "https://github.com/crmne/omarchy-hyprmoncfg.git"

[[plugin]]
id = "crmne.mpris"
git = "https://github.com/crmne/omarchy-mpris.git"

[[plugin]]
id = "io.github.golgor.cloud-sql-tracker"
git = "https://github.com/golgor/cloud-sql-tracker-oma-plugin.git"

[[plugin]]
id = "omarchy-multi-output"
git = "https://github.com/MADS0LADEN/omarchy-multi-output.git"

[[plugin]]
id = "shmall.lock"
git = "https://github.com/shmall03/omarchy-shmall.lock-plugin.git"
hosts = ["golgor-pc"]

[[plugin]]
id = "vt.sun"
git = "https://github.com/vitally/omarchy-solar-times.git"
hosts = ["golgor-pc"]
