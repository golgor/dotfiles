name: basic-memory

services:
  init-state:
    image: ghcr.io/basicmachines-co/basic-memory:0.23.2
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/state"]
    volumes:
      - basic-memory-state:/state

  basic-memory:
    depends_on:
      init-state:
        condition: service_completed_successfully
    image: ghcr.io/basicmachines-co/basic-memory:0.23.2
    command:
      - basic-memory
      - mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:22196:8000"
    environment:
      # The image sets BASIC_MEMORY_PROJECT_ROOT=/app/data, which ignores each
      # project's configured path and registers it at /app/data/<name>. KB is
      # mounted at /app/data/KB, so the watcher found no directory and the index
      # froze silently. Empty disables the constraint; config.json paths apply.
      BASIC_MEMORY_PROJECT_ROOT: ""
    volumes:
      - basic-memory-state:/home/appuser/.basic-memory
      - ./config.json:/home/appuser/.basic-memory/config.json
      - ./bmignore:/home/appuser/.basic-memory/.bmignore:ro
      - ${HOME}/Documents/ToolSense/KB:/app/data/KB
    restart: unless-stopped

volumes:
  basic-memory-state:
