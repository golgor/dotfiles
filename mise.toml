# Dotfiles managed by mise. See AGENTS.md for the working model, README.md for humans.
# Docs: https://mise.jdx.dev/dotfiles.html

[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
# Whole-file symlinks. Source is inferred as ~/.dotfiles/<home-relative-path>.
"~/.config/git/config" = { mode = "symlink" }
"~/.config/atuin/config.toml" = { mode = "symlink" }
"~/.config/herdr/config.toml" = { mode = "symlink" }

# Directories mise does not fully own: link each file, leave neighbours untouched.
"~/.bash_completions.d" = { source = ".bash_completions.d", mode = "symlink-each" }
