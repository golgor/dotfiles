# Dotfiles managed by mise. See AGENTS.md for the working model, README.md for humans.
# Docs: https://mise.jdx.dev/dotfiles.html

# No [tools] here: a project [tools] table would override the global version
# inside ~/.dotfiles. All tools, including the uv that runs the tasks below,
# come from the tracked global config at .config/mise/config.toml. The tasks
# are not expected to run before bootstrap has finished, so global uv suffices.

[bootstrap.packages]
# Google Cloud CLI and GKE auth plugin are host packages on Omarchy/Arch.
# AUR packages should use "latest" because AUR helpers build the current PKGBUILD.
"aur:google-cloud-cli" = "latest"
"aur:google-cloud-cli-component-gke-gcloud-auth-plugin" = "latest"
"aur:cloud-sql-proxy-bin" = "latest"
# Hyprland monitor profile manager + daemon.
"aur:hyprmoncfg-bin" = "latest"
# fnox prerequisites.
"pacman:rbw" = "latest"
# rbw silent-unlock via keyring: rbw-pinentry-keyring reads the master password
# from the GNOME keyring; libsecret provides secret-tool.
"aur:rbw-pinentry-keyring" = "latest"
"pacman:libsecret" = "latest"

# systemd user oneshot that unlocks the rbw vault at login, before the first
# terminal's fnox hook resolves secrets. Without it the first shell after a cold
# boot races a still-cold rbw-agent and fnox silently drops the secrets that lose
# the unlock (e.g. unset $SLACK_AXI_TOKEN). mise writes the unit file, enables it
# (wanted_by) and starts it (start), so `mise bootstrap` sets it up on any machine
# with no manual `systemctl --user enable`. Unlock is silent because the
# passwordless login keyring is already open. See docs/rbw-fnox-research.md.
[bootstrap.linux.systemd.units.rbw-unlock]
description = "Unlock the rbw (Bitwarden) vault at login"
exec_start = "/usr/bin/rbw unlock"
type = "oneshot"
remain_after_exit = true
timeout_start_sec = "30"
after = ["graphical-session.target"]
wanted_by = ["graphical-session.target"]
start = true

# Python-backed tasks; see automation/pyproject.toml. Bash-native ones live as files under .mise/tasks/.
# Takes an optional manifest name: `mise run update-skills mattpocock` updates only that one.
[tasks.update-skills]
description = "Sync vendored skills from upstream manifests in .mise/skills/*.toml"
run = "uv run --project automation --no-dev skills update"

[tasks.deploy-skills]
description = "Project skill directory symlinks into Pi, Claude Code, and Codex"
run = "uv run --project automation --no-dev skills deploy"

[tasks.check]
description = "Lint, format-check, type-check, and test automation/"
dir = "automation"
run = ["uv run ruff check", "uv run ruff format --check", "uv run ty check", "uv run pytest"]

# Runs at bootstrap step 17. Enable package-shipped systemd *user* units that Arch
# presets leave disabled. mise's declarative systemd sections only write their own
# dev.mise.* units, so enabling an upstream unit in place is this imperative step.
# hyprmoncfgd: the Hyprland monitor daemon (see .config/hypr/AGENTS.md). enable
# --now is idempotent, so re-running bootstrap is a no-op.
[tasks.bootstrap]
description = "Enable package-shipped user services not covered by presets"
run = "systemctl --user enable --now hyprmoncfgd"

[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]

# Directories mise does not fully own: link each file, leave neighbours untouched.
"~/.bash_completions.d" = { source = ".bash_completions.d", mode = "symlink-each" }
# Whole-file symlinks. Source is inferred as ~/.dotfiles/<home-relative-path>.
"~/.bashrc" = { mode = "symlink" }
# Delayed Slack launcher, invoked host-gated from hypr/autostart.lua on
# golgor-framework. Waits for network + an external monitor before starting Slack.
"~/.local/bin/slack-delayed-start" = { mode = "symlink" }
"~/.config/atuin/config.toml" = { mode = "symlink" }
# aube is mise's npm backend engine; this file allowlists niche AXI CLIs past
# aube's low-download gate. See docs/axi/README.md.
"~/.config/aube/config.toml" = { mode = "symlink" }
# systemd user-session environment. lavish-axi's review server is a long-lived
# daemon reused across sessions, so a .bashrc export would miss any daemon
# started outside an interactive shell. See the file for the full reasoning.
"~/.config/environment.d/lavish-axi.conf" = { mode = "symlink" }
# fnox secret manifest + daemon config; machine-agnostic since the age cache
# was dropped (see docs/rbw-fnox-research.md), so it is tracked like any config.
"~/.config/fnox/config.toml" = { mode = "symlink" }
"~/.config/git/config" = { mode = "symlink" }
"~/.config/herdr/config.toml" = { mode = "symlink" }
"~/.config/hypr" = { mode = "symlink" }
# hyprmoncfg profiles are the version-controlled source of truth. The generated
# ~/.config/hypr/hyprmoncfg-monitors.lua stays machine-local (see .gitignore).
# Each machine auto-applies the saved profile matching its connected monitors.
"~/.config/hyprmoncfg/profiles" = { mode = "symlink" }
"~/.config/mise/config.toml" = { mode = "symlink" }

# Neovim config. Do not track lua/plugins/theme.lua; Omarchy owns the current-theme symlink.
"~/.config/nvim/.gitignore" = { mode = "symlink" }
"~/.config/nvim/.neoconf.json" = { mode = "symlink" }
"~/.config/nvim/init.lua" = { mode = "symlink" }
"~/.config/nvim/lazy-lock.json" = { mode = "symlink" }
"~/.config/nvim/lazyvim.json" = { mode = "symlink" }
"~/.config/nvim/lua/config" = { mode = "symlink" }
"~/.config/nvim/lua/plugins/all-themes.lua" = { mode = "symlink" }
"~/.config/nvim/lua/plugins/disable-news-alert.lua" = { mode = "symlink" }
"~/.config/nvim/lua/plugins/omarchy-theme-hotreload.lua" = { mode = "symlink" }
"~/.config/nvim/lua/plugins/snacks-animated-scrolling-off.lua" = { mode = "symlink" }
"~/.config/nvim/lua/plugins/terraform.lua" = { mode = "symlink" }
"~/.config/nvim/plugin/after" = { mode = "symlink" }
"~/.config/nvim/stylua.toml" = { mode = "symlink" }
"~/.config/obsidian-axi/config.json" = { mode = "symlink" }
# rbw's declarative account config; device_id + vault live in ~/.local/share/rbw.
"~/.config/rbw/config.json" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "symlink" }
"~/.config/zed/keymap.json" = { mode = "symlink" }
"~/.config/zed/settings.json" = { mode = "symlink" }

# One global append prompt for Pi and OMP; see docs/tools/omp.md.
"~/.pi/agent/APPEND_SYSTEM.md" = { source = ".pi/agent/APPEND_SYSTEM.md", mode = "symlink" }
"~/.omp/agent/APPEND_SYSTEM.md" = { source = ".pi/agent/APPEND_SYSTEM.md", mode = "symlink" }

# One MCP server list, linked into each harness's own config directory. Pi also
# auto-discovers ~/.config/mcp/mcp.json, but projecting there as well would make
# Pi read the same servers from two sources, so each harness gets one explicit
# link instead. OMP needs "type": "http" on remote servers (a bare url is read as
# stdio and rejected); Pi accepts that shape too. Tokens come from fnox's exported
# environment via ${VAR}, expanded by both harnesses. "auth": false is Pi-only and
# ignored by OMP: it keeps the unauthenticated local server out of /mcp-auth.
"~/.pi/agent/mcp.json" = { source = ".config/mcp/mcp.json", mode = "symlink" }
"~/.omp/agent/mcp.json" = { source = ".config/mcp/mcp.json", mode = "symlink" }

# Shared review prompts; each harness keeps its own discovery directory.
"~/.pi/agent/prompts/agent-review.md" = { source = ".pi/agent/prompts/agent-review.md", mode = "symlink" }
"~/.omp/agent/prompts/agent-review.md" = { source = ".pi/agent/prompts/agent-review.md", mode = "symlink" }
"~/.pi/agent/prompts/kb-review.md" = { source = ".pi/agent/prompts/kb-review.md", mode = "symlink" }
"~/.omp/agent/prompts/kb-review.md" = { source = ".pi/agent/prompts/kb-review.md", mode = "symlink" }

# Agent skills are not projected by mise: `mise run deploy-skills` (the Python automation)
# owns those symlinks so it can give Codex the directory symlinks its loader requires.
